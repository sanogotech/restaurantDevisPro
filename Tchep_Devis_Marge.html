<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7B2D12">
<title>Tchèp Devis &amp; Marge</title>
<style>
:root{--br:#7B2D12;--br2:#9A3E1C;--gold:#E8A33D;--cream:#FDF3E3;--bg:#F7F2EA;--card:#fff;--ink:#2B1A12;--muted:#7A6A60;--line:#EADFD2;--ok:#1E7B45;--okbg:#E3F4EA;--warn:#9A5B00;--warnbg:#FFF1D6;--bad:#B3261E;--badbg:#FDE3E1;--r:14px;--sh:0 1px 3px rgba(60,30,10,.08),0 4px 14px rgba(60,30,10,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--br);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.top .logo{width:36px;height:36px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-size:20px;flex:none}
header.top .ttl{flex:1;min-width:0}
header.top .ttl b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .ttl small{opacity:.8;font-size:12px}
.ibtn{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:18px;cursor:pointer;flex:none}
main{max-width:760px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bot .in{display:flex;width:100%;max-width:760px}
nav.bot button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
nav.bot button span{font-size:22px;line-height:1}
nav.bot button.on{color:var(--br);font-weight:700}
nav.bot button.on span{transform:translateY(-1px)}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:14px}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.muted{color:var(--muted);font-size:13px}
.small{font-size:13px}
.q{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--gold);color:var(--br);background:var(--cream);font-size:12px;font-weight:800;cursor:pointer;flex:none;padding:0}
.btn{border:0;border-radius:12px;padding:12px 14px;min-height:46px;background:var(--cream);color:var(--br);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--br);color:#fff}
.btn.gold{background:var(--gold);color:#3a1d06}
.btn.wa{background:#1FA855;color:#fff}
.btn.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--br)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{min-height:36px;padding:7px 10px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
input[type=text],input[type=tel],input[type=date],input[type=number],input:not([type]),select,textarea{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#FFFCF5;font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,163,61,.25)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){.g2w{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px}
.kpi b{display:block;font-size:20px;color:var(--br)}
.kpi span{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-none{background:#eee;color:#666}
.alert{border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0;display:flex;gap:8px}
.alert.ok{background:var(--okbg);color:#14512e}.alert.warn{background:var(--warnbg);color:#6b4000}.alert.bad{background:var(--badbg);color:#7d1a14}.alert.info{background:var(--cream);color:#5a2a10}
.hero{background:linear-gradient(135deg,var(--br),var(--br2));color:#fff;border-radius:18px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:"🍛";position:absolute;right:-6px;bottom:-14px;font-size:84px;opacity:.18}
.hero h2{margin:0 0 6px;color:#fff}
.hero p{margin:0 0 12px;opacity:.92;font-size:14px;max-width:85%}
.steps{display:grid;gap:10px;margin-bottom:14px}
.step{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px;cursor:pointer;border:0;text-align:left;width:100%}
.step .n{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#3a1d06;font-weight:800;display:grid;place-items:center;flex:none}
.step b{display:block}
.step .go{margin-left:auto;color:var(--muted);font-size:20px}
.seg{display:flex;background:#EFE5D8;border-radius:12px;padding:4px;gap:4px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--br);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.pcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:10px;cursor:pointer;border:0;width:100%;text-align:left;display:block}
.pcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pcard b{font-size:16px}
.pcard .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pcard .nums div{background:var(--bg);border-radius:9px;padding:6px 8px}
.pcard .nums span{display:block;font-size:11px;color:var(--muted)}
.pcard .nums strong{font-size:14px}
.bar{position:relative;height:8px;background:#EFE5D8;border-radius:99px;margin-top:10px;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bar em{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink)}
.ingrow{display:grid;grid-template-columns:1fr 92px 112px 38px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ingrow input,.ingrow select{min-height:40px;padding:7px 8px}
.ingrow .used{grid-column:1/-1;font-size:11px;color:var(--muted);margin-top:-2px}
@media(max-width:420px){.ingrow{grid-template-columns:1fr 78px 98px 36px}}
.cathd{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--br);margin:14px 0 2px}
.del{width:36px;height:36px;border-radius:10px;border:0;background:var(--badbg);color:var(--bad);cursor:pointer;font-size:16px}
.line{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#FFFCF5}
.line .lh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.line .lh select,.line .lh input{flex:1}
.lgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;width:max-content}
.stepper button{width:44px;height:44px;border:0;background:var(--cream);color:var(--br);font-size:22px;font-weight:700;cursor:pointer}
.stepper input{width:64px;border:0!important;text-align:center;min-height:44px;border-radius:0;font-weight:700;background:#fff;box-shadow:none!important}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv b{white-space:nowrap}
.kv.tot{background:var(--gold);color:#3a1d06;border-radius:10px;padding:10px 12px;border:0;margin:6px 0;font-size:17px;font-weight:800}
.kv.big{font-size:18px;font-weight:800;color:var(--br)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--br);font-weight:600}
.patron{border:2px solid #404040;background:#FAFAFA}
.patron h3{color:#303030}
body.client .patron-only{display:none!important}
.tag{display:inline-block;font-size:11px;font-weight:700;background:#404040;color:#fff;padding:2px 7px;border-radius:6px}
.reco{list-style:none;margin:8px 0 0;padding:0}
.reco li{margin:6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--br);color:#fff;font-weight:600;padding:7px 6px;text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl td:first-child{white-space:normal}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.range{margin:6px 0 12px}
.range .rl{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.range .rl b{color:var(--br)}
input[type=range]{width:100%;accent-color:var(--br);height:32px}
details.acc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
details.acc summary{list-style:none;padding:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary:after{content:"＋";margin-left:auto;color:var(--br)}
details.acc[open] summary:after{content:"－"}
details.acc .bd{padding:0 14px 14px;font-size:15px}
.tip{border-left:4px solid var(--gold);background:var(--cream);border-radius:0 10px 10px 0;padding:9px 12px;margin:8px 0;font-size:14px}
.rex{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.rex b{color:var(--br)}
.rex .les{background:var(--okbg);color:#14512e;border-radius:8px;padding:7px 9px;margin-top:6px;font-size:14px}
.target{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.target .v{font-weight:800;color:var(--br);font-size:18px;min-width:78px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ok);flex:none;margin-top:1px}
.overlay{position:fixed;inset:0;background:rgba(30,15,5,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;border-radius:20px 20px 0 0;border-bottom:1px solid var(--line)}
.sheet .sh b{flex:1;font-size:17px}
.sheet .sb{overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.x{width:38px;height:38px;border-radius:50%;border:0;background:var(--cream);color:var(--br);font-size:18px;cursor:pointer}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#popO{z-index:60;align-items:center;padding:16px}
.pop{background:#fff;border-radius:18px;max-width:480px;width:100%;max-height:86vh;overflow-y:auto;padding:18px;animation:up .2s ease}
.pop h3{font-size:18px;color:var(--br);margin-bottom:8px}
.pop .ex{background:var(--cream);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.pop .ex b{color:var(--br)}
#tourO{z-index:70;align-items:center;padding:16px}
.tour{background:#fff;border-radius:22px;max-width:420px;width:100%;padding:24px 20px 18px;text-align:center;animation:up .2s ease}
.tour .em{font-size:58px;line-height:1.1}
.tour h3{justify-content:center;font-size:20px;margin:10px 0 8px;color:var(--br)}
.tour p{color:var(--muted);margin:0 0 16px}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--br);width:22px;border-radius:99px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2B1A12;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.hist{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.hist div{flex:1;min-width:0}
.hist b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.explain{background:var(--cream);border-radius:12px;padding:10px 12px;font-size:14px}
.explain ol{margin:6px 0 0;padding-left:20px}
.explain li{margin:3px 0}
.search{position:relative;margin-bottom:6px}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
#printArea{display:none}
@media print{
 body *{visibility:hidden}
 #printArea,#printArea *{visibility:visible}
 #printArea{display:block;position:absolute;left:0;top:0;width:100%;font-family:Arial,sans-serif;color:#000;font-size:12px}
 #printArea h1{font-size:20px;margin:0;color:#7B2D12}
 #printArea table{width:100%;border-collapse:collapse;margin:10px 0}
 #printArea th,#printArea td{border:1px solid #999;padding:5px 7px;text-align:right}
 #printArea th:nth-child(1),#printArea td:nth-child(1),#printArea th:nth-child(2),#printArea td:nth-child(2){text-align:left}
 #printArea th{background:#7B2D12;color:#fff}
 #printArea .tt td{font-weight:bold;background:#E8A33D}
 @page{margin:14mm}
}
</style>
</head>

  obj:{charges:150000,benef:300000,plat:'avg',parCmd:20},
  pc:{plat:'p1',mode:'benef',val:1200}},
 ui:{tab:'home',seen:false,patron:true,platsSeg:'plats',simSeg:'hausse',seq:2}
}}
/* ===================== ÉTAT ===================== */
let S;
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);const d=defaults();return Object.assign(d,o,{params:Object.assign(d.params,o.params||{}),sim:Object.assign(d.sim,o.sim||{}),ui:Object.assign(d.ui,o.ui||{})})}}catch(e){}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();
/* ===================== OUTILS ===================== */
const NF=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const F=n=>NF.format(Math.round(isFinite(n)?n:0))+' F';
const P=x=>(x==null||!isFinite(x))?'—':(Math.round(x*1000)/10).toLocaleString('fr-FR')+' %';
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:n};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ingById=id=>S.ings.find(x=>x.id===id);
const platById=id=>S.plats.find(x=>x.id===id);
const ceilTo=(v,a)=>a>0?Math.ceil(v/a-1e-9)*a:v;
const pctv=x=>Math.round(x*1000)/10;
function grp(ing){const n=(ing.n||'').toLowerCase();
 if(ing.c==='Protéine'){if(/poulet|volaille|pintade|dinde/.test(n))return'poulet';if(/poisson|tilapia|thon|maquereau|chinchard|capitaine|carpe|sardine|crevette/.test(n))return'poisson';return'viande'}
 return {Féculent:'fec',Légume:'leg',Aromate:'leg',Sauce:'leg','Matière grasse':'huile',Cuisson:'energie',Emballage:'emb'}[ing.c]||'leg'}
/* ===================== CALCULS ===================== */
function platCalc(p,fac){
 const m=S.params.marge;let mat=0;
 (p.lines||[]).forEach(l=>{const g=ingById(l.i);if(!g)return;const f=fac?fac(g):1;mat+=g.p*f*num(l.q)});
 const por=num(p.portions)||0;const brut=por?mat/por:0;const rev=brut*(1+S.params.pertes);
 const cons=rev?ceilTo(rev/(1-m),S.params.arr):0;const prix=num(p.prix);
 const marge=prix?prix-rev:null;const taux=prix?marge/prix:null;const fc=prix?rev/prix:null;
 const st=!prix?'none':taux>=m-1e-9?'ok':taux>0?'warn':'bad';
 return{mat,brut,rev,cons,prix,marge,taux,fc,st}}
function tierRate(n){const t=[...S.tiers].filter(x=>num(x.min)>0).sort((a,b)=>a.min-b.min);let r=0;t.forEach(x=>{if(n>=x.min)r=num(x.r)});return r}
function devisCalc(d){
 d=d||S.devis;const m=S.params.marge;let nb=0,st=0,cp=0;const L=[];
 d.lines.forEach((l,i)=>{const p=platById(l.plat);const q=num(l.q);
  if(!p){L.push(null);return}const c=platCalc(p);const pu=num(l.pn)>0?num(l.pn):c.prix;
  const mt=q*pu,co=q*c.rev;nb+=q;st+=mt;cp+=co;L.push({p,c,q,pu,mt,co,mg:mt-co,neg:num(l.pn)>0})});
 let fr=0,fc=0;const FR=d.frais.map(f=>{const q=num(f.q),mt=q*num(f.pv),co=q*num(f.co);fr+=mt;fc+=co;return{mt,co,mg:mt-co}});
 const forced=String(d.rf).trim()!=='';const r=forced?num(d.rf)/100:tierRate(nb);
 const rem=st*r,net=st-rem,ht=net+fr,tva=ht*S.params.tva,ttc=ht+tva;
 const acp=Math.round(ttc*S.params.acompte/10)*10,solde=ttc-acp;
 const cout=cp+fc,benef=ht-cout,taux=ht?benef/ht:0,parPlat=nb?benef/nb:0,plancher=cout/(1-m);
 const rmax=st?1-(cout/(1-m)-fr)/st:0;
 const status=nb<S.params.min?'min':benef<0?'bad':taux<m-1e-9?'warn':'ok';
 return{L,FR,nb,st,r,forced,rem,net,fr,fc,ht,tva,ttc,acp,solde,cp,cout,benef,taux,parPlat,plancher,rmax,status}}
function badge(st){return{ok:'<span class="badge b-ok">✔ Marge conforme</span>',warn:'<span class="badge b-warn">⚠ Sous la cible</span>',bad:'<span class="badge b-bad">✖ Vente à perte</span>',none:'<span class="badge b-none">Prix à saisir</span>'}[st]}
function bar(t){const m=S.params.marge,max=.7,w=Math.max(0,Math.min(t||0,max))/max*100,c=(t||0)>=m?'var(--ok)':(t||0)>0?'var(--gold)':'var(--bad)';
 return`<div class="bar"><i style="width:${w}%;background:${c}"></i><em style="left:${m/max*100}%" title="Cible"></em></div>`}
const qbtn=k=>`<button class="q" data-a="help" data-k="${k}" aria-label="Aide">i</button>`;

/* ===================== AIDE CONTEXTUELLE ===================== */
function exPlat(){const p=S.plats[0];return p?{p,c:platCalc(p)}:null}
const HELP={
 general:()=>({t:'Comment utiliser l\'appli ?',b:`<p>L'appli suit une chaîne simple :</p><p><b>Prix d'achat au kg → recette → coût par plat → devis → bénéfice</b></p><ol><li><b>Plats › Prix d'achat</b> : mettez vos vrais prix du marché.</li><li><b>Plats › Mes plats</b> : vérifiez les recettes et mettez votre prix de vente.</li><li><b>Devis</b> : choisissez plats et quantités, ajoutez les frais, envoyez par WhatsApp.</li><li><b>Simuler</b> : testez « et si les prix montent ? », un gros événement, votre objectif du mois.</li><li><b>Conseils</b> : cibles, astuces, bonnes pratiques.</li></ol><p>Touchez le petit <span class="q">i</span> partout pour une explication avec exemple.</p><div class="ex">💾 Vos données restent <b>sur ce téléphone</b>. Faites une sauvegarde de temps en temps (⚙ Réglages).</div>`}),
 mercuriale:()=>({t:'Prix d\'achat (mercuriale)',b:`<p>C'est la liste de tout ce que vous achetez, avec le <b>prix que vous payez vraiment</b> et l'unité (kg, litre, pièce, lot…).</p><p>Quand vous changez un prix ici, <b>tous les plats et tous les devis se recalculent</b> automatiquement.</p><div class="ex"><b>Exemple :</b> le riz passe de 700 F à 800 F le kg → le coût de chaque Tchèp augmente tout seul, et l'appli vous dit si votre prix de vente est encore bon.</div><div class="tip">Mettez à jour les prix <b>au moins une fois par semaine</b>, surtout poulet, poisson, huile et tomate qui bougent beaucoup.</div>`}),
 lot:()=>({t:'Unité « lot »',b:`<p>Certaines dépenses ne se pèsent pas : épices, gaz, charbon. On les compte en <b>lot</b> = ce qu'il faut pour une recette de 10 portions.</p><div class="ex"><b>Exemple :</b> une bouteille de gaz de 6 kg à 5 000 F permet environ 10 cuissons de 10 portions → <b>1 lot gaz = 500 F</b>.</div>`}),
 portions:()=>({t:'Portions de la recette',b:`<p>Nombre de plats que donne la recette telle qu'elle est écrite. Toutes les quantités sont pour ce nombre de portions.</p><div class="ex"><b>Exemple :</b> 2,5 kg de riz + 3 kg de poulet + … = <b>10 plats</b>. Si vous mettez 20 portions, il faut doubler les quantités.</div>`}),
 cout:()=>{const e=exPlat();return{t:'Coût de revient par plat',b:`<p>C'est ce que <b>vous coûte réellement un plat</b> : ingrédients + huile + épices + gaz + emballage, plus une marge de sécurité pour les pertes.</p><p><b>Formule :</b> (coût de la recette ÷ portions) × (1 + pertes)</p>${e?`<div class="ex"><b>Exemple ${esc(e.p.n)} :</b><br>Recette : ${F(e.c.mat)} pour ${e.p.portions} plats<br>÷ ${e.p.portions} = ${F(e.c.brut)}<br>+ ${P(S.params.pertes)} de pertes = <b>${F(e.c.rev)} par plat</b></div>`:''}`}},
 conseille:()=>{const e=exPlat();return{t:'Prix conseillé',b:`<p>Le prix minimum pour garder votre <b>marge cible (${P(S.params.marge)})</b>, arrondi à ${S.params.arr} F au-dessus.</p><p><b>Formule :</b> coût de revient ÷ (1 − marge cible)</p>${e?`<div class="ex"><b>Exemple ${esc(e.p.n)} :</b> ${F(e.c.rev)} ÷ ${(1-S.params.marge).toLocaleString('fr-FR')} = ${F(e.c.rev/(1-S.params.marge))} → arrondi <b>${F(e.c.cons)}</b></div>`:''}<div class="tip">⚠ Ne faites pas « coût + 40 % » : ça donne une marge de seulement 28,6 % sur le prix de vente !</div>`}},
 marge:()=>({t:'Marge et taux de marge',b:`<p><b>Marge</b> = prix de vente − coût de revient (en F).</p><p><b>Taux de marge</b> = marge ÷ prix de vente (en %). C'est ce qui reste pour payer le loyer, l'électricité, les salaires… et votre bénéfice.</p><div class="ex"><b>Exemple :</b> vendu 3 000 F, coûte 1 722 F → marge 1 278 F → taux <b>42,6 %</b>. Sur 100 F encaissés, il vous reste 42,6 F.</div><p>La petite barre noire sur les jauges = votre cible.</p>`}),
 foodcost:()=>({t:'Food cost',b:`<p>Part du prix de vente qui part dans le coût du plat : coût de revient ÷ prix de vente.</p><div class="ex"><b>Exemple :</b> 1 722 F ÷ 3 000 F = <b>57 %</b>. Avec une marge cible de 40 %, le food cost doit rester sous 60 %.</div>`}),
 pertes:()=>({t:'Pertes & sécurité',b:`<p>Un pourcentage ajouté au coût pour couvrir : épluchures, riz collé, morceau de poulet raté, plat goûté, erreur de dosage…</p><div class="ex"><b>Exemple :</b> 5 % sur 1 640 F = +82 F → coût retenu 1 722 F.</div><div class="tip">Si vous jetez souvent, montez à 8–10 %. Mieux : réduisez les pertes !</div>`}),
 min:()=>({t:'Minimum de plats',b:`<p>L'appli est faite pour les <b>commandes groupées de ${S.params.min} plats et plus</b> (bureaux, fêtes, cérémonies). En dessous, une alerte s'affiche.</p><div class="tip">Petite commande = même temps de préparation et de livraison, mais peu de bénéfice. Gardez votre minimum !</div>`}),
 negocie:()=>({t:'Prix négocié',b:`<p>Laissez vide pour utiliser le <b>prix carte</b>. Remplissez seulement si vous accordez un prix spécial pour ce client.</p><div class="ex"><b>Exemple :</b> Tchèp poulet carte 3 000 F, négocié 2 700 F pour une entreprise fidèle. L'appli vous montre si vous restez rentable.</div>`}),
 remise:()=>({t:'Remise volume',b:`<p>Remise appliquée automatiquement selon le nombre de plats (barème dans ⚙ Réglages) :</p>${S.tiers.map(t=>`• dès ${t.min} plats : <b>${P(t.r)}</b>`).join('<br>')}<p>Pour forcer une autre remise, tapez-la dans « Remise forcée ». Laissez vide pour revenir au barème.</p><div class="tip">⚠ Une remise de 8 % peut faire perdre 20 % de votre bénéfice ! Regardez toujours la « Vue patron » avant d'accepter.</div>`}),
 frais:()=>({t:'Frais annexes',b:`<p>Tout ce qui n'est pas dans l'assiette : livraison, serveurs, location de matériel, boissons, décoration…</p><p><b>Prix facturé</b> = ce que paie le client. <b>Coût réel</b> = ce que ça vous coûte (vue patron).</p><div class="ex"><b>Exemple :</b> livraison facturée 5 000 F, carburant + livreur 3 000 F → vous gagnez 2 000 F.</div><div class="tip">Ne livrez jamais gratuitement sans l'avoir calculé dans le prix des plats.</div>`}),
 acompte:()=>({t:'Acompte',b:`<p>Somme payée à la confirmation (${P(S.params.acompte)} du total). Elle sert à acheter les matières premières sans utiliser votre trésorerie.</p><div class="tip">Pas d'acompte = pas d'achat de marchandise. C'est votre protection contre les annulations.</div>`}),
 plancher:()=>({t:'Prix plancher',b:`<p>Le <b>montant HT minimum</b> à facturer pour cette commande pour atteindre votre marge cible.</p><p><b>Formule :</b> coût total ÷ (1 − marge cible)</p><div class="ex"><b>Exemple :</b> coût total 93 850 F ÷ 0,60 = <b>156 417 F</b>. Si votre devis est en dessous, vous travaillez pour moins que votre objectif.</div>`}),
 patron:()=>({t:'Vue client / Vue patron',b:`<p><b>Vue client</b> : uniquement ce que le client doit voir (plats, prix, total).</p><p><b>Vue patron</b> : en plus, vos coûts, votre <b>bénéfice</b>, le prix plancher et les recommandations.</p><div class="tip">Passez en vue client avant de montrer l'écran à un client. L'impression et le message WhatsApp n'affichent jamais vos coûts.</div>`}),
 tva:()=>({t:'TVA',b:`<p>Laissez 0 % si votre activité n'est pas assujettie à la TVA (cas fréquent des petites structures). Sinon mettez le taux applicable.</p><div class="tip">En cas de doute sur votre régime fiscal, demandez à un comptable ou au centre des impôts.</div>`}),
 sim_hausse:()=>({t:'Et si les prix montent ?',b:`<p>Bougez les curseurs pour simuler une hausse (ou une baisse) des prix d'achat. L'appli montre l'effet sur le coût et la marge de chaque plat, et le nouveau prix conseillé.</p><div class="ex"><b>Exemple :</b> poulet +20 % → le Tchèp poulet coûte ~150 F de plus par plat. Sur 50 plats, c'est 7 500 F de bénéfice en moins si vous ne bougez pas vos prix.</div><p>Vos vrais prix ne sont <b>pas modifiés</b>.</p>`}),
 sim_event:()=>({t:'Simulateur gros événement',b:`<p>Pour un mariage, des funérailles, un séminaire… entrez le nombre d'invités (1 plat par invité), le plat, la remise et le nombre d'invités par serveur.</p><p>L'appli calcule le total, votre bénéfice et la <b>remise maximale</b> possible en restant à votre cible.</p><p>Bouton « Créer le devis » = le devis est rempli automatiquement.</p>`}),
 sim_obj:()=>({t:'Objectif du mois',b:`<p>Combien de plats vendre pour payer vos <b>charges fixes</b> (loyer, salaires, électricité, eau, crédit…) et gagner le <b>bénéfice</b> que vous visez ?</p><p><b>Formule :</b> (charges + bénéfice visé) ÷ marge par plat</p><div class="ex"><b>Exemple :</b> (150 000 + 300 000) ÷ 1 278 F = <b>353 plats</b> par mois, soit environ 18 commandes de 20 plats.</div>`}),
 sim_prix:()=>({t:'Quel prix fixer ?',b:`<p>Choisissez un plat puis ce que vous voulez gagner : <b>un montant par plat</b> (ex. 1 000 F) ou <b>un taux de marge</b> (ex. 45 %). L'appli donne le prix de vente à afficher.</p>`})
};

const TIPS=['Demandez toujours un acompte avant d\'acheter la marchandise.','Pesez vos portions avec une louche ou une barquette de même taille : même quantité = même coût.','Mettez à jour le prix du poulet et de l\'huile chaque semaine.','Proposez un menu « Entreprise » à prix fixe : plus simple à vendre et à préparer.','Une photo propre de vos plats sur WhatsApp Business vend mieux qu\'un long message.','Notez chaque commande dans l\'historique : vous saurez quels plats rapportent vraiment.','Ne comptez pas votre propre travail « gratuit » : prévoyez-le dans les charges.','Achetez riz, huile et emballages en gros quand le prix est bas, si vous avez de la place pour stocker.','Une remise se négocie contre quelque chose : paiement d\'avance, commande régulière, recommandation.','Livrez 15 minutes avant l\'heure : la ponctualité fait revenir les entreprises.','Gardez un plat « vedette » moins cher (ex. Tchèp poisson) pour attirer, et un plat « premium » (viande) pour la marge.','Calculez le gaz et l\'emballage : ce sont les coûts qu\'on oublie le plus.'];

 <tr><td></td><td>Sous-total plats</td><td></td><td>${F(c.st)}</td></tr>${c.rem?`<tr><td></td><td>Remise volume (${P(c.r)})</td><td></td><td>− ${F(c.rem)}</td></tr>`:''}
 <tr><td></td><td>Total HT</td><td></td><td>${F(c.ht)}</td></tr>${c.tva?`<tr><td></td><td>TVA</td><td></td><td>${F(c.tva)}</td></tr>`:''}
 <tr class="tt"><td></td><td>TOTAL À PAYER</td><td></td><td>${F(c.ttc)}</td></tr><tr><td></td><td>Acompte à la confirmation (${P(S.params.acompte)})</td><td></td><td>${F(c.acp)}</td></tr><tr><td></td><td>Solde à la livraison</td><td></td><td>${F(c.solde)}</td></tr></table>
 <p style="font-size:11px">Devis valable ${S.params.validite} jours, établi sur la base des prix du jour des matières premières. Toute modification de quantité doit être signalée au moins 48 h avant la livraison.</p><p style="margin-top:30px">Bon pour accord (date, nom et signature du client) :</p>`}
function copyText(t){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('Texte copié ✓'),()=>fallbackCopy(t))}else fallbackCopy(t)}
function fallbackCopy(t){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Texte copié ✓')}catch(e){toast('Copie impossible')}a.remove()}
/* ===================== ACTIONS ===================== */
const A={
 tab(el){S.ui.tab=el.dataset.v;save();render();window.scrollTo(0,0)},
 goPrix(){S.ui.tab='plats';S.ui.platsSeg='prix';save();render();window.scrollTo(0,0)},
 goPlats(){S.ui.tab='plats';S.ui.platsSeg='plats';save();render();window.scrollTo(0,0)},
 pseg(el){S.ui.platsSeg=el.dataset.v;save();render()},
 sseg(el){S.ui.simSeg=el.dataset.v;save();render()},
 help(el){help(el.dataset.k)},closePop(){$('#popO').classList.remove('on')},
 settings(){openSheet({type:'settings'})},closeSheet(){closeSheet()},
 tour(){tourStep=0;showTour()},tourNext(){if(tourStep<TOUR.length-1){tourStep++;showTour()}else A.tourEnd()},
 tourEnd(){$('#tourO').classList.remove('on');S.ui.seen=true;save()},
 editPlat(el){openSheet({type:'plat',id:el.dataset.id})},
 addPlat(){const p={id:uid('p'),n:'Nouveau plat',cat:'Plat africain',portions:10,prix:0,lines:[{i:'riz',q:2.5},{i:'emb',q:10}]};S.plats.push(p);save();render();openSheet({type:'plat',id:p.id})},
 dupPlat(){const p=platById(sheet.id);const c=JSON.parse(JSON.stringify(p));c.id=uid('p');c.n=p.n+' (copie)';S.plats.push(c);save();sheet.id=c.id;renderSheet();refresh();toast('Plat dupliqué')},
 delPlat(){const p=platById(sheet.id);if(!confirm('Supprimer « '+p.n+' » ?'))return;S.plats=S.plats.filter(x=>x!==p);S.devis.lines=S.devis.lines.filter(l=>l.plat!==p.id);save();closeSheet();toast('Plat supprimé')},
 useCons(){const p=platById(sheet.id);p.prix=platCalc(p).cons;save();renderSheet();refresh();toast('Prix conseillé appliqué ✓')},
 addLine(){platById(sheet.id).lines.push({i:'',q:0});save();renderSheet();refresh();const s=$('#sheet .sb');s.scrollTop=s.scrollHeight},
 delLine(el){platById(sheet.id).lines.splice(+el.dataset.i,1);save();renderSheet();refresh()},
 addIng(){const g={id:uid('i'),n:'Nouveau produit',c:'Autre',u:'kg',p:0};S.ings.push(g);save();render();const e=document.querySelector(`[data-id="${g.id}"][data-k="n"]`);if(e){e.scrollIntoView({block:'center'});e.select()}},
 delIng(el){const id=el.dataset.id,g=ingById(id),u=S.plats.filter(p=>p.lines.some(l=>l.i===id));if(!confirm(u.length?`« ${g.n} » est utilisé dans ${u.length} plat(s). Le supprimer aussi des recettes ?`:`Supprimer « ${g.n} » ?`))return;
  S.ings=S.ings.filter(x=>x.id!==id);S.plats.forEach(p=>p.lines=p.lines.filter(l=>l.i!==id));save();render()},
 patron(el){S.ui.patron=el.dataset.v==='1';save();render()},
 qty(el){const l=S.devis.lines[+el.dataset.i];l.q=Math.max(0,num(l.q)+(+el.dataset.d));const inp=$('#dlq_'+el.dataset.i);if(inp)inp.value=l.q;save();refresh()},
 delDl(el){S.devis.lines.splice(+el.dataset.i,1);save();render()},
 quickPlat(el){const ex=S.devis.lines.find(l=>l.plat===el.dataset.id);if(ex){ex.q=num(ex.q)+10;toast('+10 '+platById(el.dataset.id).n)}else S.devis.lines.push({plat:el.dataset.id,q:10,pn:''});save();render()},
 delDf(el){S.devis.frais.splice(+el.dataset.i,1);save();render()},
 quickFrais(el){S.devis.frais.push({d:el.dataset.d,q:1,pv:+el.dataset.pv,co:+el.dataset.co});save();render();toast(el.dataset.d+' ajouté — vérifiez le prix')},
 wa(){const tel=(S.devis.tel||'').replace(/\D/g,'');window.open('https://wa.me/'+tel+'?text='+encodeURIComponent(devisText()),'_blank')},
 copy(){copyText(devisText())},
 print(){buildPrint();window.print()},
 saveDevis(){const c=devisCalc(),d=S.devis;const rec={num:d.num,date:fmtDate(d.date),client:d.client,nb:c.nb,ttc:c.ttc,benef:c.benef,data:JSON.parse(JSON.stringify(d))};
  const i=S.history.findIndex(x=>x.num===d.num);if(i>=0)S.history[i]=rec;else S.history.unshift(rec);save();render();toast('Devis '+d.num+' enregistré ✓')},
 newDevis(){if(!confirm('Commencer un nouveau devis ? (Pensez à enregistrer le devis actuel)'))return;S.ui.seq=(S.ui.seq||1)+1;const y=new Date().getFullYear();S.devis=newDevis(`DV-${y}-${String(S.ui.seq).padStart(3,'0')}`);save();render();window.scrollTo(0,0)},
 openHist(el){const h=S.history[+el.dataset.i];S.devis=JSON.parse(JSON.stringify(h.data));save();render();window.scrollTo(0,0);toast('Devis '+h.num+' ouvert')},
 delHist(el){if(!confirm('Supprimer ce devis de l\'historique ?'))return;S.history.splice(+el.dataset.i,1);save();render()},
 simReset(){Object.keys(S.sim.f).forEach(k=>S.sim.f[k]=0);save();render()},
 evToDevis(){const e=S.sim.ev,p=platById(e.plat);if(!p)return;const st=Math.ceil(num(e.n)/Math.max(1,num(e.serv)));const y=new Date().getFullYear();S.ui.seq=(S.ui.seq||1)+1;
  S.devis=Object.assign(newDevis(`DV-${y}-${String(S.ui.seq).padStart(3,'0')}`),{event:'Événement '+e.n+' invités',lines:[{plat:p.id,q:num(e.n),pn:num(e.pu)?num(e.pu):''}],frais:[{d:'Livraison',q:1,pv:num(e.livPv),co:num(e.livCo)},{d:'Personnel de service (par personne)',q:st,pv:num(e.servPv),co:num(e.servCo)}],rf:String(e.remise)});
  S.ui.tab='devis';save();render();window.scrollTo(0,0);toast('Devis créé — complétez le client')},
 pcMode(el){S.sim.pc.mode=el.dataset.v;S.sim.pc.val=el.dataset.v==='benef'?1200:Math.round(S.params.marge*100);save();render()},
 applyPc(){const p=platById(S.sim.pc.plat);if(!p||!sheetPc)return;p.prix=sheetPc;save();render();toast(p.n+' : '+F(sheetPc)+' ✓')},
 ckReset(){Object.keys(S.ui).forEach(k=>{if(/^ck\d+$/.test(k))delete S.ui[k]});save();render()},
 export(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sauvegarde-tchep-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Sauvegarde téléchargée')},
 import(){$('#fileIn').click()},
 reset(){if(!confirm('Effacer vos données et revenir aux données d\'exemple ?'))return;const seen=S.ui.seen;S=defaults();S.ui.seen=seen;save();sheet=null;$('#sheetO').classList.remove('on');render();toast('Données d\'exemple rechargées')}
};
/* ===================== SAISIE ===================== */
function onInput(t){const f=t.dataset.f,k=t.dataset.k,i=+t.dataset.i,v=t.value;
 switch(f){
  case'search':{const q=v.trim().toLowerCase();document.querySelectorAll('.ingrow[data-name]').forEach(r=>r.style.display=r.dataset.name.includes(q)?'':'none');return}
  case'param':S.params[k]=t.dataset.t==='pct'?Math.min(num(v),95)/100:t.dataset.t==='num'?num(v):v;if(k==='nom')$('#hName').textContent=v;break;
  case'tier':S.tiers[i][k]=k==='r'?num(v)/100:num(v);break;
  case'ing':{const g=ingById(t.dataset.id);g[k]=k==='p'?num(v):v;break}
  case'plat':{const p=platById(sheet.id);p[k]=k==='n'?v:num(v);if(k==='n'){const b=$('#sheet .sh b');if(b)b.textContent=v}break}
  case'pline':platById(sheet.id).lines[i].q=num(v);break;
  case'dc':S.devis[k]=v;break;
  case'dl':S.devis.lines[i][k]=k==='pn'?(v.trim()===''?'':num(v)):num(v);break;
  case'df':S.devis.frais[i][k]=k==='d'?v:num(v);break;
  case'drf':S.devis.rf=v.trim()===''?'':num(v);break;
  case'simf':S.sim.f[k]=num(v);break;
  case'sime':S.sim.ev[k]=k==='pu'?(v.trim()===''?'':num(v)):num(v);break;
  case'simo':S.sim.obj[k]=num(v);break;
  case'simp':S.sim.pc[k]=num(v);break;
  default:return}
 save();refresh()}
function onChange(t){const c=t.dataset.c,k=t.dataset.k,i=+t.dataset.i,v=t.value;if(!c)return;
 switch(c){
  case'ing':ingById(t.dataset.id)[k]=v;break;
  case'plat':platById(sheet.id)[k]=v;break;
  case'pline':platById(sheet.id).lines[i].i=v;break;
  case'dl':S.devis.lines[i].plat=v;break;
  case'sime':S.sim.ev[k]=v;break;
  case'simo':S.sim.obj[k]=v;break;
  case'simp':S.sim.pc[k]=v;break;
  case'ck':S.ui['ck'+i]=t.checked;save();return}
 save();render()}
/* ===================== DÉMARRAGE ===================== */
if(typeof document!=='undefined'&&document.getElementById('view')){
 document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;if(A[a.dataset.a]){e.preventDefault();A[a.dataset.a](a,e)}});
 document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.f)onInput(e.target)});
 document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.c)onChange(e.target)});
 $('#sheetO').addEventListener('click',e=>{if(e.target.id==='sheetO')closeSheet()});
 $('#popO').addEventListener('click',e=>{if(e.target.id==='popO')A.closePop()});
 $('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.ings||!o.plats)throw 0;S=Object.assign(defaults(),o);save();sheet=null;$('#sheetO').classList.remove('on');render();toast('Données importées ✓')}catch(x){toast('Fichier invalide')}};r.readAsText(f);e.target.value=''});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#popO').classList.contains('on'))A.closePop();else if(sheet)closeSheet()}});
 render();if(!S.ui.seen)showTour();
}
</script>
